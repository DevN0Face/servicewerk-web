[project]
name = "servicewerk-web"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.4",
    "whitenoise[brotli]>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py",
]
addopts = "-ra --strict-markers"


[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    ".venv",
    "migrations",
    "node_modules",
    "staticfiles",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "I001"]
